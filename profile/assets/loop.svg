<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="The life of an agent run: fork a world from main in about 2 microseconds, work in plain SQL that no one else sees, diff every changed row, check your merge policy, then merge into your database in one checked transaction. A merge outside the rules is held for a person. A merge can be undone for 30 days."><title>The life of an agent run: fork a world from main in about 2 microseconds, work in plain SQL that no one else sees, diff every changed row, check your merge policy, then merge into your database in one checked transaction. A merge outside the rules is held for a person. A merge can be undone for 30 days.</title><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.run{offset-path:path('M 210 268 C 270 268 270 150 330 150 L 810 150 C 870 150 870 268 930 268');animation:run 7s cubic-bezier(.45,0,.55,1) infinite}@keyframes run{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}.dash{stroke-dasharray:5 7;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}.pulse{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,86%{r:7}93%{r:12}100%{r:7}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="399" rx="14" fill="#050505" stroke="#2c2c2c"/><text class="m" x="64" y="62" font-size="13" letter-spacing="2.4" fill="#9a9a94">THE LIFE OF AN AGENT RUN</text><line x1="64" y1="268" x2="1136" y2="268" stroke="#f2f2ee" stroke-width="2"/><text class="m" x="64" y="296" font-size="12" letter-spacing="2" fill="#5c5c58">MAIN</text><text class="m" x="1136" y="296" font-size="12" letter-spacing="2" fill="#5c5c58" text-anchor="end">YOUR DATABASE</text><path d="M 210 268 C 270 268 270 150 330 150 L 810 150 C 870 150 870 268 930 268" fill="none" stroke="#c8ff2e" stroke-width="2"/><path class="dash" d="M 730 150 C 730 96 760 84 812 84" fill="none" stroke="#9a9a94" stroke-width="1.5"/><rect x="816" y="62" width="320" height="44" rx="6" fill="#0b0b0b" stroke="#2c2c2c"/><text class="m" x="832" y="81" font-size="12" letter-spacing="2" fill="#f2f2ee">HELD</text><text class="s" x="832" y="98" font-size="13" fill="#9a9a94">outside the rules: a person approves or drops it</text><path class="dash" d="M 930 268 C 930 342 770 342 770 276" fill="none" stroke="#9a9a94" stroke-width="1.5"/><path d="M 764 286 L 770 274 L 776 286" fill="none" stroke="#9a9a94" stroke-width="1.5"/><text class="m" x="850" y="352" font-size="12" letter-spacing="2" fill="#f2f2ee" text-anchor="middle">UNDO</text><text class="s" x="850" y="371" font-size="13" fill="#9a9a94" text-anchor="middle">put a merge back, for 30 days</text><circle cx="210" cy="268" r="7" fill="#050505" stroke="#c8ff2e" stroke-width="2"/><text class="m" x="210" y="302" font-size="13" letter-spacing="2" fill="#f2f2ee" text-anchor="middle">FORK</text><text class="s" x="210" y="321" font-size="13" fill="#9a9a94" text-anchor="middle">a world, in about 2 µs</text><circle cx="410" cy="150" r="7" fill="#050505" stroke="#c8ff2e" stroke-width="2"/><text class="m" x="410" y="110" font-size="13" letter-spacing="2" fill="#f2f2ee" text-anchor="middle">WORK</text><text class="s" x="410" y="129" font-size="13" fill="#9a9a94" text-anchor="middle">plain SQL, seen by no one else</text><circle cx="570" cy="150" r="7" fill="#050505" stroke="#c8ff2e" stroke-width="2"/><text class="m" x="570" y="110" font-size="13" letter-spacing="2" fill="#f2f2ee" text-anchor="middle">DIFF</text><text class="s" x="570" y="129" font-size="13" fill="#9a9a94" text-anchor="middle">every changed row</text><circle cx="730" cy="150" r="7" fill="#050505" stroke="#c8ff2e" stroke-width="2"/><text class="m" x="730" y="184" font-size="13" letter-spacing="2" fill="#f2f2ee" text-anchor="middle">RULES</text><text class="s" x="730" y="203" font-size="13" fill="#9a9a94" text-anchor="middle">your merge policy</text><circle class="pulse" cx="930" cy="268" r="7" fill="#c8ff2e"/><text class="m" x="1010" y="230" font-size="13" letter-spacing="2" fill="#f2f2ee" text-anchor="middle">MERGE</text><text class="s" x="1010" y="249" font-size="13" fill="#9a9a94" text-anchor="middle">one checked transaction</text><circle class="run" r="5" fill="#c8ff2e"/></svg>
