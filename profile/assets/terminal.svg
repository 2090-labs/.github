<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-label="A psql session. The agent creates a world, updates 84 leads and deletes 11, then asks to merge. The merge is held for review because the policy allows no deletes. A person reads the diff and approves, and the change is written to the database in one checked transaction."><title>A psql session. The agent creates a world, updates 84 leads and deletes 11, then asks to merge. The merge is held for review because the policy allows no deletes. A person reads the diff and approves, and the change is written to the database in one checked transaction.</title><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.l{animation:show 20s linear infinite backwards}@keyframes show{0%{opacity:0}1.5%,88%{opacity:1}92%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="447" rx="14" fill="#050505" stroke="#2c2c2c"/><path d="M .5 52 H 1199.5" stroke="#2c2c2c"/><circle cx="34" cy="27" r="5.5" fill="#2c2c2c"/><circle cx="54" cy="27" r="5.5" fill="#2c2c2c"/><circle cx="74" cy="27" r="5.5" fill="#2c2c2c"/><text class="m" x="600.0" y="32" font-size="12.5" letter-spacing="1.5" fill="#9a9a94" text-anchor="middle">psql postgres://127.0.0.1:5433/main</text><text class="m l" style="animation-delay:0.00s" x="64" y="96" font-size="15.5" xml:space="preserve"><tspan fill="#5c5c58">-- the agent, on its own branch of the whole database</tspan></text><text class="m l" style="animation-delay:0.85s" x="64" y="123" font-size="15.5" xml:space="preserve"><tspan fill="#c8ff2e">bot=&gt;</tspan><tspan fill="#f2f2ee"> create world run_42 with (task = 'clean up stale leads');</tspan></text><text class="m l" style="animation-delay:1.70s" x="64" y="150" font-size="15.5" xml:space="preserve"><tspan fill="#c8ff2e">bot=&gt;</tspan><tspan fill="#f2f2ee"> update leads set status = 'stale' where last_contact &lt; now() - interval '1 year';</tspan></text><text class="m l" style="animation-delay:2.55s" x="64" y="177" font-size="15.5" xml:space="preserve"><tspan fill="#9a9a94">UPDATE 84</tspan></text><text class="m l" style="animation-delay:3.40s" x="64" y="204" font-size="15.5" xml:space="preserve"><tspan fill="#c8ff2e">bot=&gt;</tspan><tspan fill="#f2f2ee"> delete from leads where email is null;</tspan></text><text class="m l" style="animation-delay:4.25s" x="64" y="231" font-size="15.5" xml:space="preserve"><tspan fill="#9a9a94">DELETE 11</tspan></text><text class="m l" style="animation-delay:5.10s" x="64" y="258" font-size="15.5" xml:space="preserve"><tspan fill="#c8ff2e">bot=&gt;</tspan><tspan fill="#f2f2ee"> merge world run_42;</tspan></text><text class="m l" style="animation-delay:5.95s" x="64" y="285" font-size="15.5" xml:space="preserve"><tspan fill="#ffb454">-- held for review: it deletes 11 rows, and the policy says max_deletes = 0</tspan></text><text class="m l" style="animation-delay:6.80s" x="64" y="312" font-size="15.5" xml:space="preserve"><tspan fill="#5c5c58">-- you: look at exactly what changed, then decide</tspan></text><text class="m l" style="animation-delay:7.65s" x="64" y="339" font-size="15.5" xml:space="preserve"><tspan fill="#f2f2ee">you=&gt;</tspan><tspan fill="#f2f2ee"> diff world run_42;</tspan></text><text class="m l" style="animation-delay:8.50s" x="64" y="366" font-size="15.5" xml:space="preserve"><tspan fill="#f2f2ee">you=&gt;</tspan><tspan fill="#f2f2ee"> merge world run_42;</tspan></text><text class="m l" style="animation-delay:9.35s" x="64" y="393" font-size="15.5" xml:space="preserve"><tspan fill="#c8ff2e">-- approved: written to your database in one checked transaction</tspan></text><rect class="cur" x="64" y="406" width="9" height="18" fill="#c8ff2e"/></svg>
