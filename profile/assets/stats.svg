<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="About 2 microseconds to fork a world at any size. Works beside 4 databases. 30 days to undo a merge by its id. 31 MCP tools for an agent."><title>About 2 microseconds to fork a world at any size. Works beside 4 databases. 30 days to undo a merge by its id. 31 MCP tools for an agent.</title><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="1199" height="169" rx="14" fill="#050505" stroke="#2c2c2c"/><text class="s" x="64" y="90" font-size="44" font-weight="600" letter-spacing="-1.2" fill="#c8ff2e">~2 µs</text><text class="s" x="64" y="120" font-size="14.5" fill="#9a9a94">to fork a world, at any size</text><line x1="308" y1="44" x2="308" y2="126" stroke="#2c2c2c"/><text class="s" x="332" y="90" font-size="44" font-weight="600" letter-spacing="-1.2" fill="#f2f2ee">4</text><text class="s" x="332" y="120" font-size="14.5" fill="#9a9a94">databases it works beside</text><line x1="576" y1="44" x2="576" y2="126" stroke="#2c2c2c"/><text class="s" x="600" y="90" font-size="44" font-weight="600" letter-spacing="-1.2" fill="#f2f2ee">30 days</text><text class="s" x="600" y="120" font-size="14.5" fill="#9a9a94">to undo a merge by its id</text><line x1="844" y1="44" x2="844" y2="126" stroke="#2c2c2c"/><text class="s" x="868" y="90" font-size="44" font-weight="600" letter-spacing="-1.2" fill="#f2f2ee">31</text><text class="s" x="868" y="120" font-size="14.5" fill="#9a9a94">MCP tools for an agent</text></svg>
